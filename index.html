<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BudujTaniej.pl</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f4f4;
}

header{
background:#0f766e;
color:white;
text-align:center;
padding:60px 20px;
}

header h1{
font-size:48px;
margin:0;
}

header p{
font-size:20px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
margin-top:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input, textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
}

button{
background:#0f766e;
color:white;
border:none;
padding:15px 30px;
cursor:pointer;
font-size:18px;
border-radius:5px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>BudujTaniej.pl</h1>
<p>Portal przetargów budowlanych dla osób budujących dom</p>
</header>

<div class="container">

<div class="card">
<h2>Dodaj inwestycję</h2>

<input type="text" placeholder="Imię i nazwisko">

<input type="email" placeholder="Adres e-mail">

<textarea rows="6" placeholder="Opisz inwestycję"></textarea>

<button>Wyślij zgłoszenie</button>
</div>

<div class="card">
<h2>Dla wykonawców</h2>
<p>Znajduj nowe zlecenia budowlane i pozyskuj klientów.</p>
</div>

<div class="card">
<h2>RODO</h2>
<p>Przesyłając formularz wyrażasz zgodę na przetwarzanie danych w celu kontaktu dotyczącego inwestycji.</p>
</div>

</div>

<footer>
© 2026 BudujTaniej.pl
</footer>

</body>
</html>
